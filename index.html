ô tả / Ghi chú</label><textarea id="taskDescription" name="description" maxlength="3500" placeholder="Yêu cầu, deliverable, link tham chiếu...">${text(t.description||'')}</textarea><span class="form-help">Có thể thêm đường dẫn Figma, tài liệu hoặc brief vào phần ghi chú.</span></div></div><div class="modal-actions">${edit?`<button class="danger" type="button" id="deleteTask">Xóa task</button>`:''}<button class="secondary push-right" type="button" id="cancelTask">Hủy</button><button type="submit" class="primary">${icon('check')} ${edit?'Lưu thay đổi':'Tạo task'}</button></div></form></div></div>`}
function modalBackup(){return `<div class="modal-backdrop" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><div class="eyebrow">YOUR WORKSPACE DATA</div><h3>Sao lưu & dữ liệu</h3></div><button class="icon-btn" id="closeModal">${icon('x')}</button></div><div class="modal-body"><p class="backup-info">Dữ liệu được lưu trên <b>server chung (Supabase)</b> và đồng bộ cho cả team (tự cập nhật mỗi ~20 giây). Dùng <b>Xuất JSON</b> để giữ bản sao lưu định kỳ. Dùng CSV để mở danh sách task bằng Excel/Google Sheets.</p><div class="backup-actions"><button class="primary" id="exportJSON">${icon('download')} Xuất JSON</button><button class="secondary" id="exportCSV">${icon('download')} Xuất CSV</button><button class="secondary" id="importJSON">Nhập JSON</button></div><div class="small-note">Lưu ý: Nhập JSON hoặc khôi phục dữ liệu mẫu sẽ thay thế toàn bộ task của <b>cả team</b>. Hãy xuất JSON trước khi làm.</div><div class="backup-actions" style="margin-top:22px"><button class="danger" id="resetSample">Khôi phục 19 task khởi tạo</button></div></div><div class="modal-actions"><button class="secondary push-right" id="closeBackup">Đóng</button></div></div></div>`}
function render(){const scroll=window.scrollY;document.getElementById('app').innerHTML=`<div class="app">${renderSidebar()}<main class="main">${renderTop()}<div class="content">${state.view==='overview'?renderDashboard():state.view==='board'?renderBoard():state.view==='list'?renderList():renderCalendar()}</div></main></div>${state.modal?(state.modal==='backup'?modalBackup():modalTask(tasks.find(t=>t.id===state.modal)||null)):''}`;window.scrollTo(0,scroll)}
function toast(message){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3300)}
function openTask(id){state.modal=id;render();setTimeout(()=>document.getElementById('taskTitle')?.focus(),30)}function openNew(status){state.modal='new';render();let sel=document.getElementById('taskStatus');if(sel)sel.value=status||'todo';setTimeout(()=>document.getElementById('taskTitle')?.focus(),30)}function closeModal(){state.modal=null;render()};function changed(){render()}
function downloadFile(filename,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csvValue(v){let val=String(v??'');if(/^[=+@\-\t\r]/.test(val))val="'"+val;return '"'+val.replaceAll('"','""')+'"'}
function exportCSV(){const headers=['ID','Task','Category','Status','Priority','Owner','Due','Description'];const rows=tasks.map(t=>[t.id,t.title,cat(t.category).name,stat(t.status).label,pri(t.priority).label,t.owner,t.due,t.description]);downloadFile('Bloom_Tasks_'+localToday()+'.csv','\uFEFF'+[headers,...rows].map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Đã xuất danh sách CSV')}
function exportJSON(){downloadFile('Bloom_Backup_'+localToday()+'.json',JSON.stringify({app:'Bloom Workspace',version:1,exportedAt:new Date().toISOString(),tasks},null,2),'application/json');toast('Đã xuất bản sao JSON')}
function uniqueId(){let max=tasks.reduce((m,t)=>Math.max(m,+(t.id.match(/^BLM-(\d+)$/)?.[1]||0)),0);return 'BLM-'+String(max+1).padStart(3,'0')}
function fileImport(file){if(!file)return;if(file.size>10*1024*1024){toast('File quá lớn (tối đa 10MB)');return}let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),data=Array.isArray(obj)?obj:obj.tasks;if(!Array.isArray(data)||data.length>10000||!data.every(validTask)||data.some(t=>!categories.some(c=>c.id===t.category)||!statuses.some(s=>s.id===t.status)))throw Error('Định dạng dữ liệu task không hợp lệ');if(!confirm(`Nhập ${data.length} task và thay thế toàn bộ ${tasks.length} task hiện tại của cả team? Bạn nên xuất bản sao trước.`))return;const list=data.map(t=>({id:String(t.id),title:String(t.title).slice(0,160),category:t.category,status:t.status,priority:priorities.some(p=>p.id===t.priority)?t.priority:'medium',owner:String(t.owner||'').slice(0,80),due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',description:String(t.description||'').slice(0,3500),created:String(t.created||localToday())}));state.modal=null;state.category='all';state.status='all';state.priority='all';state.search='';sync(()=>replaceAll(list),`Đã nhập ${list.length} task`)}catch(e){toast('Không thể nhập: dữ liệu JSON không hợp lệ')}};reader.readAsText(file,'utf-8')}
function handleClick(e){let btn=e.target.closest('button,[data-open],[data-sort],[data-nav],[data-category]');if(e.target.matches('[data-backdrop]')){closeModal();return}if(!btn)return;let ds=btn.dataset;if(ds.nav){state.view=ds.nav;render();return}if(ds.category){state.category=ds.category;state.view='board';render();return}if(ds.new){openNew(ds.new);return}if(ds.open){openTask(ds.open);return}if(ds.sort){if(state.sortKey===ds.sort)state.sortDir*=-1;else{state.sortKey=ds.sort;state.sortDir=1}render();return}switch(btn.id){case 'backupBtn':state.modal='backup';render();break;case 'clearFilters':state.category='all';state.status='all';state.priority='all';state.search='';render();break;case 'closeModal':case 'cancelTask':case 'closeBackup':closeModal();break;case 'deleteTask':{let t=tasks.find(t=>t.id===state.modal);if(t&&confirm(`Xóa công việc “${t.title}”?`)){state.modal=null;sync(()=>api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}),'Đã xóa công việc')}break}case 'exportCSV':exportCSV();break;case 'exportJSON':exportJSON();break;case 'importJSON':document.getElementById('importFile').click();break;case 'resetSample':if(confirm('Thay thế toàn bộ task hiện tại bằng 19 task khởi tạo? Hãy sao lưu trước khi tiếp tục.')){state.modal=null;sync(()=>replaceAll(seeds),'Đã khôi phục dữ liệu mẫu')}break;case 'calToday':state.calendarDate=new Date();render();break;case 'calPrev':state.calendarDate=addMonths(state.calendarDate,-1);render();break;case 'calNext':state.calendarDate=addMonths(state.calendarDate,1);render();break}}
let searchTimer;document.addEventListener('click',handleClick);document.addEventListener('change',e=>{if(e.target.id==='categoryFilter'){state.category=e.target.value;render()}if(e.target.id==='statusFilter'){state.status=e.target.value;render()}if(e.target.id==='priorityFilter'){state.priority=e.target.value;render()}if(e.target.id==='importFile'){fileImport(e.target.files[0]);e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.search=e.target.value;const start=e.target.selectionStart;const end=e.target.selectionEnd;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const inp=document.getElementById('globalSearch');inp.focus();inp.setSelectionRange(start,end)},180)}});document.addEventListener('submit',e=>{if(e.target.id!=='taskForm')return;e.preventDefault();let f=new FormData(e.target),title=String(f.get('title')||'').trim();if(!title){toast('Vui lòng nhập tên công việc');return}let old=tasks.find(t=>t.id===state.modal),obj={title,category:f.get('category'),status:f.get('status'),priority:f.get('priority'),due:f.get('due')||'',owner:String(f.get('owner')||'').trim(),description:String(f.get('description')||'').trim()};e.target.querySelector('[type=submit]').disabled=true;state.modal=null;sync(async()=>{if(old){const rows=await api('tasks?id=eq.'+encodeURIComponent(old.id),{method:'PATCH',body:JSON.stringify(obj)});if(!rows.length)throw Error('task đã bị người khác xóa');return}for(let i=0;;i++){try{await api('tasks',{method:'POST',body:JSON.stringify({...obj,id:uniqueId(),created:localToday()})});return}catch(err){if(err.code!=='23505'||i>=4)throw err;tasks=await fetchTasks()}}},old?'Đã cập nhật công việc':'Đã tạo công việc mới')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){closeModal();return}if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!state.modal&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openNew('todo')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')&&!e.target.matches('button')){e.preventDefault();openTask(e.target.dataset.open)}});
let dragging=null;document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-drag]');if(!card)return;dragging=card.dataset.drag;card.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging)}});document.addEventListener('dragend',e=>{dragging=null;document.querySelectorAll('.dragover,.dragging').forEach(el=>el.classList.remove('dragover','dragging'))});document.addEventListener('dragover',e=>{let col=e.target.closest('[data-drop]');if(col){e.preventDefault();document.querySelectorAll('.dragover').forEach(el=>{if(el!==col)el.classList.remove('dragover')});col.classList.add('dragover')}});document.addEventListener('drop',e=>{let col=e.target.closest('[data-drop]');if(!col||!dragging)return;e.preventDefault();let task=tasks.find(t=>t.id===dragging);if(task&&task.status!==col.dataset.drop){const s=col.dataset.drop;task.status=s;render();sync(()=>api('tasks?id=eq.'+encodeURIComponent(task.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s})}),`Đã chuyển sang “${stat(s).label}”`)}dragging=null});
/* Tự đồng bộ thay đổi của thành viên khác: mỗi 20s và khi quay lại tab (bỏ qua khi đang nhập liệu/kéo thả) */
function idle(){return !state.modal&&!dragging&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)}
async function poll(){if(document.hidden||!idle())return;const before=JSON.stringify(tasks);if(await refresh(true)&&JSON.stringify(tasks)!==before&&idle())render()}
setInterval(poll,20000);window.addEventListener('focus',poll);
if(SUPABASE_URL.startsWith('PASTE')){document.getElementById('app').innerHTML='<div class="empty-state"><h3>Chưa cấu hình Supabase</h3><p>Mở index.html và điền SUPABASE_URL, SUPABASE_KEY.</p></div>'}else{document.getElementById('app').innerHTML='<div class="empty-state"><div class="empty-symbol">✳</div><h3>Đang tải dữ liệu...</h3></div>';refresh(false).then(render)}
})();
</script>
</body>
</html>
