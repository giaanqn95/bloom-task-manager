async function changePassword(){const g=id=>document.getElementById(id).value,msg=m=>{const el=document.getElementById('pwMsg');el.textContent=m},old=g('pwOld'),a=g('pwNew'),b=g('pwNew2'),btn=document.getElementById('pwSubmit');if(!old||!a||!b){msg('Vui lòng nhập đầy đủ các ô');return}if(a.length<8){msg('Mật khẩu mới tối thiểu 8 ký tự');return}if(a!==b){msg('Hai mật khẩu mới không khớp');return}if(a===old){msg('Mật khẩu mới phải khác mật khẩu hiện tại');return}btn.disabled=true;try{let j;try{j=await authReq('token?grant_type=password',{email:authEmail(),password:old})}catch(e){throw Error(e.status===400?'Mật khẩu hiện tại không đúng':e.message)}authSave(sessionFrom(j));await authReq('user',{password:a},auth.access_token,'PUT');closeModal();toast('Đã đổi mật khẩu')}catch(e){msg(e.message);const b2=document.getElementById('pwSubmit');if(b2)b2.disabled=false}}
function renderAuth(view,msg,ok){authView=view||'login';const t={login:['Đăng nhập','Chỉ thành viên được mời mới truy cập được Bloom Workspace.'],forgot:['Quên mật khẩu','Nhập email, chúng mình sẽ gửi link đặt lại mật khẩu.'],setpw:['Đặt mật khẩu','Tạo mật khẩu để đăng nhập các lần sau (tối thiểu 8 ký tự).']}[authView];document.getElementById('app').innerHTML=`<div class="auth-wrap"><form class="auth-card" id="authForm" data-view="${authView}" novalidate><div class="brand-name auth-brand">BLOOM</div><h1>${t[0]}</h1><p class="auth-sub">${t[1]}</p><div class="auth-msg ${ok?'ok':''}" id="authMsg" role="alert">${text(msg||'')}</div>${authView!=='setpw'?`<label>Email<input type="email" id="authEmail" autocomplete="username" required></label>`:''}${authView==='login'||authView==='setpw'?`<label>${authView==='setpw'?'Mật khẩu mới':'Mật khẩu'}<input type="password" id="authPass" autocomplete="${authView==='setpw'?'new-password':'current-password'}" required></label>`:''}${authView==='setpw'?`<label>Nhập lại mật khẩu<input type="password" id="authPass2" autocomplete="new-password" required></label>`:''}<button class="primary" type="submit" id="authSubmit">${authView==='login'?'Đăng nhập':authView==='forgot'?'Gửi link đặt lại':'Lưu mật khẩu'}</button>${authView==='login'?`<button type="button" class="link-btn" data-authview="forgot">Quên mật khẩu?</button>`:authView==='forgot'?`<button type="button" class="link-btn" data-authview="login">← Quay lại đăng nhập</button>`:''}</form></div>`;setTimeout(()=>document.getElementById(authView==='setpw'?'authPass':'authEmail')?.focus(),20)}
function authMessage(m,ok){const el=document.getElementById('authMsg');if(el){el.textContent=m||'';el.classList.toggle('ok',!!ok)}}
async function authSubmit(form){const v=form.dataset.view,btn=document.getElementById('authSubmit'),val=id=>(document.getElementById(id)||{}).value||'';btn.disabled=true;try{if(v==='login'){const email=val('authEmail').trim(),pw=val('authPass');if(!email||!pw){authMessage('Vui lòng nhập email và mật khẩu');return}const j=await authReq('token?grant_type=password',{email,password:pw});authSave(sessionFrom(j));await enterApp()}else if(v==='forgot'){const email=val('authEmail').trim();if(!email){authMessage('Vui lòng nhập email');return}await authReq('recover',{email});authMessage('Nếu email thuộc team, bạn sẽ nhận được link đặt lại mật khẩu trong ít phút.',true)}else{const a=val('authPass'),b=val('authPass2');if(a.length<8){authMessage('Mật khẩu tối thiểu 8 ký tự');return}if(a!==b){authMessage('Hai mật khẩu không khớp');return}const tok=await authToken();const user=await authReq('user',{password:a},tok,'PUT');authSave({...auth,user:user.id?user:auth.user});await enterApp();toast('Đã đặt mật khẩu')}}catch(e){authMessage(e.message)}finally{const b2=document.getElementById('authSubmit');if(b2)b2.disabled=false}}
async function enterApp(){document.getElementById('app').innerHTML='<div class="empty-state"><div class="empty-symbol">✳</div><h3>Đang tải dữ liệu...</h3></div>';await refresh(false);applyRoute()}
async function logout(){try{if(auth)await authReq('logout',null,auth.access_token)}catch(e){}authSave(null);tasks=[];renderAuth('login')}

function taskUrl(id){return location.href.split('#')[0]+'#/task/'+encodeURIComponent(id)}
async function copyLink(id){const url=taskUrl(id);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);toast('Đã sao chép link vào clipboard');return}}catch(e){}try{const ta=document.createElement('textarea');ta.value=url;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,url.length);const ok=document.execCommand('copy');ta.remove();if(ok){toast('Đã sao chép link vào clipboard');return}}catch(e){}toast('Trình duyệt không cho phép sao chép. Hãy copy thủ công.');window.prompt('Link task (Ctrl/Cmd+C để sao chép):',url)}
function closeMenus(){document.querySelectorAll('.more-menu:not(.hide)').forEach(m=>{m.classList.add('hide');m.parentNode.querySelector('.more-btn')?.setAttribute('aria-expanded','false')})}
function toggleMenu(btn){const menu=btn.parentNode.querySelector('.more-menu'),was=!menu.classList.contains('hide');closeMenus();if(was)return;menu.classList.remove('hide');btn.setAttribute('aria-expanded','true');const r=btn.getBoundingClientRect(),w=menu.offsetWidth||170;menu.style.top=Math.min(r.bottom+4,window.innerHeight-menu.offsetHeight-8)+'px';menu.style.left=Math.max(8,Math.min(r.right-w,window.innerWidth-w-8))+'px';menu.querySelector('button')?.focus()}
function moreMenu(id,extra){return `<span class="more"><button type="button" class="more-btn" data-more-toggle="1" aria-haspopup="menu" aria-expanded="false" aria-label="Thao tác khác" title="Thao tác khác">⋯</button><div class="more-menu hide" role="menu"><button type="button" role="menuitem" data-copylink="${text(id)}">🔗 Copy link</button>${extra||''}</div></span>`}
let tasks=[];let state={view:'overview',category:'all',status:'all',priority:'all',owner:'all',search:'',sortKey:'category',sortDir:1,calendarDate:new Date(),modal:null,taskId:null,editing:null};let toastTimer;
function validTask(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.category==='string'&&typeof t.status==='string'}
async function api(path,opt={}){const h={apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})};const tok=await authToken();if(tok)h.Authorization='Bearer '+tok;else if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,{...opt,headers:h});if(r.status===401&&auth){authSave(null);renderAuth('login','Phiên đăng nhập đã hết hạn, hãy đăng nhập lại.')}if(!r.ok){const e=await r.json().catch(()=>({}));throw Object.assign(new Error(e.message||r.statusText),{code:e.code})}const txt=await r.text();return txt?JSON.parse(txt):null}
function safeUrl(u){return u&&String(u).startsWith(SUPABASE_URL)?u:'#'}
function fmtSize(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function filesHtml(list){return list.length?list.map((f,i)=>`<div class="file-item"><a href="${text(safeUrl(f.url))}" target="_blank" rel="noopener">${text(f.name)}</a><span>${fmtSize(f.size)}</span><button type="button" class="danger" data-rmfile="${i}">Xóa</button></div>`).join(''):''}
function paintFiles(){const el=document.getElementById('outputFiles');if(el)el.innerHTML=filesHtml(draftFiles)}
async function uploadFile(file){const safe=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80)||'file';const path=crypto.randomUUID()+'/'+safe;const tok=await authToken();const r=await fetch(SUPABASE_URL+'/storage/v1/object/task-outputs/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,...(tok?{Authorization:'Bearer '+tok}:{}),'Content-Type':file.type||'application/octet-stream'},body:file});if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.message||r.statusText)}return {name:file.name,size:file.size,path,url:SUPABASE_URL+'/storage/v1/object/public/task-outputs/'+path}}
async function handleUpload(files){for(const f of files){if(f.size>MAX_FILE){toast(`“${f.name}” vượt quá 20MB`);continue}if(draftFiles.length>=20){toast('Tối đa 20 file mỗi task');break}toast('Đang tải lên: '+f.name);try{draftFiles.push(await uploadFile(f));paintFiles();toast('Đã tải lên: '+f.name)}catch(e){toast('Tải file lỗi: '+e.message)}}}
function pick(t){const o={};FIELDS.forEach(k=>o[k]=t[k]??(k==='output_files'?[]:''));return o}
async function fetchTasks(){const rows=await api('tasks?select='+FIELDS.join(',')+'&order=seq.desc');return rows.map(r=>({...r,owner:r.owner||'',due:r.due||'',description:r.description||'',output_text:r.output_text||'',output_files:Array.isArray(r.output_files)?r.output_files:[]}))}
async function insertMany(list){if(!list.length)return;await api('tasks?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify([...list].reverse().map(pick))})}
async function replaceAll(list){await api('tasks?id=not.is.null',{method:'DELETE',headers:{Prefer:'return=minimal'}});await insertMany(list)}
async function refresh(silent){try{tasks=await fetchTasks();return true}catch(e){if(!silent)toast('Không tải được dữ liệu: '+e.message);return false}}
async function sync(action,okMsg){try{await action();await refresh(true);changed();if(okMsg)toast(okMsg)}catch(e){await refresh(true);changed();toast('Lỗi lưu dữ liệu: '+e.message)}}
function text(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cat(id){return categories.find(c=>c.id===id)||categories[0]};function stat(id){return statuses.find(c=>c.id===id)||statuses[0]};function pri(id){return priorities.find(c=>c.id===id)||priorities[1]};function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function fmtDate(v){if(!v)return 'Chưa có deadline';let a=v.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:v};function parseDate(v){if(!v)return null;let x=v.split('-');return new Date(+x[0],+x[1]-1,+x[2])};function dateDiff(d){if(!d)return null;let today=parseDate(localToday());return Math.round((parseDate(d)-today)/86400000)};function overdue(t){return t.status!=='done'&&t.due&&dateDiff(t.due)<0};function upcoming(t){return t.status!=='done'&&t.due&&dateDiff(t.due)>=0&&dateDiff(t.due)<=7};function initials(name){let s=(name||'—').trim();return (s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('')||'?').toUpperCase()};function pct(n,d){return d?Math.round(n/d*100):0};function matches(t){return (state.category==='all'||t.category===state.category)&&(state.status==='all'||t.status===state.status)&&(state.priority==='all'||t.priority===state.priority)&&(state.owner==='all'||(state.owner==='__none'?!t.owner:t.owner===state.owner))&&(!state.search||[t.title,descText(t.description),t.owner,t.category,t.id].join(' ').toLocaleLowerCase('vi').includes(state.search.toLocaleLowerCase('vi')))};function filtered(){return tasks.filter(matches)};
function renderSidebar(){return `<aside class="sidebar"><div class="brand"><div class="brandmark"><i></i><i></i><i></i><i></i></div><div class="brand-name-wrap"><div class="brand-name">BLOOM</div><div class="brand-sub">project workspace</div></div></div><div class="nav"><div class="sidebar-label">Không gian làm việc</div>${[['overview','grid','Tổng quan'],['board','board','Kanban Board'],['list','list','Danh sách task'],['calendar','calendar','Lịch deadline']].map(([v,ic,label])=>`<button type="button" class="nav-item ${(state.view===v||(state.view==='task'&&v==='board'))?'active':''}" data-nav="${v}" title="${label}">${icon(ic)}<span>${label}</span></button>`).join('')}</div><div class="sidebar-modules"><div class="side-divider"></div><div class="sidebar-label">Hạng mục dự án</div>${categories.map(c=>`<button type="button" data-category="${c.id}" class="module-item ${state.category===c.id?'active':''}"><span class="module-dot" style="background:${c.bg}"></span><span>${text(c.name)}</span><span class="module-count">${tasks.filter(t=>t.category===c.id&&t.status!=='done').length}</span></button>`).join('')}<button type="button" data-category="all" class="module-item ${state.category==='all'?'active':''}"><span class="module-dot" style="background:#eee"></span><span>Tất cả hạng mục</span></button></div><div class="sidebar-bottom"><div class="workspace-mini"><div class="workspace-eyebrow">Bloom / 2026</div><strong>Safe to feel</strong><p>Không gian quản lý các đầu việc Branding, Product, Website và Launch.</p></div></div></aside>`}
function renderTop(){return `<header class="topbar"><div class="crumb">Workspace <span style="padding:0 7px;color:#c2b8c2">/</span> <b>Bloom Project</b></div><div class="top-spacer"></div><div class="search-wrap">${icon('search')}<input aria-label="Tìm kiếm task" type="search" id="globalSearch" class="top-search" placeholder="Tìm kiếm task..." value="${text(state.search)}"></div><button class="icon-btn" id="backupBtn" title="Sao lưu / nhập dữ liệu">${icon('download')}</button><button class="icon-btn" id="passwordBtn" title="Đổi mật khẩu" aria-label="Đổi mật khẩu">🔑</button><button class="icon-btn" id="logoutBtn" title="Đăng xuất ${text(authEmail())}" aria-label="Đăng xuất">⏻</button><button class="primary" data-new="todo">${icon('plus')}<span class="new-label">Tạo task mới</span></button></header>`}
function heading(kicker,title,description,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1 class="title">${title}</h1><p class="subtitle">${description}</p></div>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`}
function renderDashboard(){let done=tasks.filter(t=>t.status==='done').length,doing=tasks.filter(t=>t.status==='doing').length,late=tasks.filter(overdue).length,week=tasks.filter(upcoming).length,p=pct(done,tasks.length);let focus=tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.status==='doing'?0:1)-(b.status==='doing'?0:1)||({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority])).slice(0,5);return `${heading('PROJECT OVERVIEW','Bloom Workspace','Theo dõi tiến độ từ xây dựng thương hiệu đến website, sản phẩm và launch.')}
<div class="hero"><div class="hero-contents"><div class="hero-kicker">✦&nbsp; Bloom project · launch workspace</div><h2>From an idea<br>to a blooming brand.</h2><p>Mỗi công việc là một bước tiến trên hành trình xây dựng Bloom — tinh tế, rõ ràng và có thể theo dõi.</p><div class="hero-foot"><span class="pill">● ${tasks.length} công việc</span><span>${categories.length} hạng mục</span></div></div><div class="ring" style="--pct:${p}%"><div class="ring-inner"><span class="ring-number">${p}%</span><span class="ring-caption">completed</span></div></div></div>
<div class="stats">${[[icon('layers'),'Tổng công việc',tasks.length],[icon('clock'),'Đang thực hiện',doing],[icon('checkcircle'),'Đã hoàn thành',done],[icon('flag'),'Quá hạn',late]].map(([ic,name,n])=>`<div class="stat"><div class="stat-icon">${ic}</div><div class="stat-label">${name}</div><div class="stat-number">${n}</div></div>`).join('')}</div>
<div class="dashboard-grid"><section><div class="section-heading"><h3>Tiến độ theo hạng mục</h3><span>${done}/${tasks.length} hoàn thành</span></div><div class="panel">${categories.map(c=>{let tt=tasks.filter(t=>t.category===c.id),pp=pct(tt.filter(t=>t.status==='done').length,tt.length);return `<div class="module-progress"><div class="module-progress-name" title="${text(c.name)}">${text(c.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${pp}%;background:${c.color}"></div></div><div class="module-progress-percent">${pp}%</div></div>`}).join('')}</div></section><section><div class="section-heading"><h3>Ưu tiên tiếp theo</h3><span>${week} deadline trong 7 ngày</span></div><div class="panel">${focus.length?focus.map((t,i)=>`<div class="focus-task" data-open="${text(t.id)}"><div class="focus-index">${i+1}</div><div style="min-width:0;flex:1"><strong>${text(t.title)}</strong><small>${text(cat(t.category).name)} · ${text(t.owner||'Chưa phân công')}</small></div><span class="mini-priority priority-${t.priority}">${text(pri(t.priority).label)}</span></div>`).join(''):`<div class="empty-state">Không còn công việc mở 🎉</div>`}</div></section></div><p class="project-note">Dữ liệu mẫu được khởi tạo dựa trên tài liệu Bloom; các trạng thái đã hoàn thành/đang làm chỉ là gợi ý để bạn rà soát. Không có deadline được tự đặt.</p>`}
function filters(){return `<div class="filterbar"><select id="categoryFilter" aria-label="Lọc hạng mục"><option value="all">Tất cả hạng mục</option>${categories.map(c=>`<option value="${c.id}" ${state.category===c.id?'selected':''}>${text(c.name)}</option>`).join('')}</select><select id="statusFilter" aria-label="Lọc trạng thái"><option value="all">Tất cả trạng thái</option>${statuses.map(s=>`<option value="${s.id}" ${state.status===s.id?'selected':''}>${s.label}</option>`).join('')}</select><select id="priorityFilter" aria-label="Lọc ưu tiên"><option value="all">Mọi mức ưu tiên</option>${priorities.map(p=>`<option value="${p.id}" ${state.priority===p.id?'selected':''}>${p.label}</option>`).join('')}</select><select id="ownerFilter" aria-label="Lọc người phụ trách"><option value="all">Mọi người phụ trách</option><option value="__none" ${state.owner==='__none'?'selected':''}>Chưa phân công</option>${[...new Set([...members,...tasks.map(t=>t.owner).filter(Boolean)])].map(m=>`<option value="${text(m)}" ${state.owner===m?'selected':''}>${text(m)}</option>`).join('')}</select><button class="clear-btn" id="clearFilters">Xóa bộ lọc</button><span class="filter-info">Hiển thị ${filtered().length}/${tasks.length} công việc</span></div>`}

function rteKey(e){const t=e.target;if(!t||!t.closest)return;if(t.matches('.rte-link input')){const box=t.closest('.rte');if(e.key==='Enter'){e.preventDefault();e.stopPropagation();rteLinkApply(box)}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();rteLinkClose(box,true)}return}

function plainToRt(p){const lines=String(p).replace(/\r/g,'').split('\n');let out='',stack=[],plain=[];const flushP=()=>{if(plain.length){out+='<p>'+plain.join('<br>')+'</p>';plain=[]}},closeAll=()=>{while(stack.length){out+='</li></ul>';stack.pop()}};for(const line of lines){if(!line.trim()){closeAll();flushP();continue}const m=line.match(/^([ \t]*)[-*•]\s+(.*)$/);if(!m){closeAll();plain.push(rtLinkify(text(line)));continue}flushP();const w=m[1].replace(/\t/g,'  ').length;if(!stack.length||w>stack[stack.length-1]){out+='<ul><li>';stack.push(w)}else{while(stack.length>1&&w<stack[stack.length-1]){out+='</li></ul>';stack.pop()}out+='</li><li>'}out+=rtLinkify(text(m[2]))}closeAll();flushP();return out}

async function patchTask(id,fields,msg,quiet){const t=tasks.find(x=>x.id===id);if(!t)return;Object.assign(t,fields);if(!quiet)render();try{const rows=await api('tasks?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(fields)});if(!rows.length)throw Error('task đã bị xóa');if(msg)toast(msg)}catch(e){toast('Lỗi lưu: '+e.message);await refresh(true);render()}}
async function detailUpload(files){const id=state.taskId;for(const f of files){if(f.size>MAX_FILE){toast(`“${f.name}” vượt quá 20MB`);continue}const t0=tasks.find(x=>x.id===id);if(t0&&(t0.output_files||[]).length>=20){toast('Tối đa 20 file mỗi task');break}toast('Đang tải lên: '+f.name);try{const up=await uploadFile(f);const t=tasks.find(x=>x.id===id);if(!t)return;await patchTask(id,{output_files:[...(t.output_files||[]),up]},'Đã đính kèm: '+f.name)}catch(e){toast('Tải file lỗi: '+e.message)}}}

function uniqueId(){let max=tasks.reduce((m,t)=>Math.max(m,+(t.id.match(/^BLM-(\d+)$/)?.[1]||0)),0);return 'BLM-'+String(max+1).padStart(3,'0')}
function fileImport(file){if(!file)return;if(file.size>10*1024*1024){toast('File quá lớn (tối đa 10MB)');return}let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),data=Array.isArray(obj)?obj:obj.tasks;if(!Array.isArray(data)||data.length>10000||!data.every(validTask)||data.some(t=>!categories.some(c=>c.id===t.category)||!statuses.some(s=>s.id===t.status)))throw Error('Định dạng dữ liệu task không hợp lệ');if(!confirm(`Nhập ${data.length} task và thay thế toàn bộ ${tasks.length} task hiện tại của cả team? Bạn nên xuất bản sao trước.`))return;const list=data.map(t=>({id:String(t.id),title:String(t.title).slice(0,160),category:t.category,status:t.status,priority:priorities.some(p=>p.id===t.priority)?t.priority:'medium',owner:String(t.owner||'').slice(0,80),due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',description:String(t.description||'').slice(0,20000),output_text:String(t.output_text||'').slice(0,20000),output_files:Array.isArray(t.output_files)?t.output_files.filter(f=>f&&typeof f.url==='string'&&typeof f.name==='string').slice(0,20).map(f=>({name:String(f.name).slice(0,200),size:+f.size||0,path:String(f.path||''),url:f.url})):[],created:String(t.created||localToday())}));state.modal=null;state.category='all';state.status='all';state.priority='all';state.owner='all';state.search='';sync(()=>replaceAll(list),`Đã nhập ${list.length} task`)}catch(e){toast('Không thể nhập: dữ liệu JSON không hợp lệ')}};reader.readAsText(file,'utf-8')}
function handleClick(e){if(!e.target.closest('.more'))closeMenus();let btn=e.target.closest('button,[data-open],[data-sort],[data-nav],[data-category]');if(e.target.matches('[data-backdrop]')){closeModal();return}if(!btn)return;let ds=btn.dataset;if(ds.authview){renderAuth(ds.authview);return}if(ds.moreToggle!==undefined){e.stopPropagation();toggleMenu(btn);return}if(ds.copylink){closeMenus();copyLink(ds.copylink);return}if(ds.editquick){closeMenus();state.modal=ds.editquick;render();return}if(btn.id==='deleteTaskDetail')closeMenus();if(btn.id==='logoutBtn'){logout();return}if(btn.id==='passwordBtn'){state.modal='password';render();setTimeout(()=>document.getElementById('pwOld')?.focus(),30);return}if(ds.rmfile!==undefined){draftFiles.splice(+ds.rmfile,1);paintFiles();return}if(ds.rte){rteAction(ds.rte,btn);return}if(ds.rmdetail!==undefined){const t=tasks.find(x=>x.id===state.taskId);if(t)patchTask(t.id,{output_files:(t.output_files||[]).filter((_,i)=>i!==+ds.rmdetail)},'Đã gỡ file');return}if(ds.delcomment){delComment(ds.delcomment);return}if(ds.nav){navigate(ds.nav);return}if(ds.category){state.category=ds.category;navigate('board');return}if(ds.new){openNew(ds.new);return}if(ds.open){openTask(ds.open);return}if(ds.sort){if(state.sortKey===ds.sort)state.sortDir*=-1;else{state.sortKey=ds.sort;state.sortDir=1}render();return}switch(btn.id){case 'editDesc':if(state.editing){toast('Hãy lưu hoặc hủy phần đang sửa trước');break}state.editing='description';render();setTimeout(()=>document.getElementById('descEdit')?.focus(),20);break;case 'editOutput':if(state.editing){toast('Hãy lưu hoặc hủy phần đang sửa trước');break}state.editing='output';render();setTimeout(()=>document.getElementById('outputEdit')?.focus(),20);break;case 'cancelOutput':state.editing=null;render();break;case 'saveOutput':{const v=rteValue('outputEdit');if(v.length>20000){toast('Output quá dài (tối đa ~20.000 ký tự)');break}state.editing=null;patchTask(state.taskId,{output_text:v},'Đã lưu output');break}case 'cancelDesc':state.editing=null;render();break;case 'saveDesc':{const v=rteValue('descEdit');if(v.length>20000){toast('Mô tả quá dài (tối đa ~20.000 ký tự)');break}state.editing=null;patchTask(state.taskId,{description:v},'Đã lưu mô tả');break}case 'deliverTask':{const t=tasks.find(x=>x.id===state.taskId);if(!t)break;if(!t.output_text&&!(t.output_files||[]).length){toast('Hãy nhập output hoặc đính kèm file trước khi trả task');document.querySelector('[data-field=output_text]')?.focus();break}patchTask(t.id,{status:'review'},'Đã trả task → In review');break}case 'deleteTaskDetail':{const t=tasks.find(x=>x.id===state.taskId);if(t&&confirm(`Xóa công việc “${t.title}”?`)){api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}).then(()=>refresh(true)).then(()=>{navigate('board');toast('Đã xóa công việc')}).catch(err=>toast('Lỗi xóa: '+err.message))}break}case 'addComment':addComment();break;case 'backupBtn':state.modal='backup';render();break;case 'clearFilters':state.category='all';state.status='all';state.priority='all';state.owner='all';state.search='';render();break;case 'closeModal':case 'cancelTask':case 'closeBackup':closeModal();break;case 'deleteTask':{let t=tasks.find(t=>t.id===state.modal);if(t&&confirm(`Xóa công việc “${t.title}”?`)){state.modal=null;sync(()=>api('tasks?id=eq.'+encodeURIComponent(t.id),{method:'DELETE',headers:{Prefer:'return=minimal'}}),'Đã xóa công việc')}break}case 'exportCSV':exportCSV();break;case 'exportJSON':exportJSON();break;case 'importJSON':document.getElementById('importFile').click();break;case 'resetSample':if(confirm('Thay thế toàn bộ task hiện tại bằng 19 task khởi tạo? Hãy sao lưu trước khi tiếp tục.')){state.modal=null;sync(()=>replaceAll(seeds),'Đã khôi phục dữ liệu mẫu')}break;case 'calToday':state.calendarDate=new Date();render();break;case 'calPrev':state.calendarDate=addMonths(state.calendarDate,-1);render();break;case 'calNext':state.calendarDate=addMonths(state.calendarDate,1);render();break}}
let searchTimer;document.addEventListener('click',handleClick);document.addEventListener('change',e=>{if(e.target.id==='categoryFilter'){state.category=e.target.value;render()}if(e.target.id==='statusFilter'){state.status=e.target.value;render()}if(e.target.id==='priorityFilter'){state.priority=e.target.value;render()}if(e.target.id==='ownerFilter'){state.owner=e.target.value;render()}if(e.target.id==='taskOwner'){const o=document.getElementById('taskOwnerOther');if(o){o.classList.toggle('hide',e.target.value!=='__other');if(e.target.value==='__other')o.focus()}}if(e.target.id==='detailFile'){const fs=[...e.target.files];e.target.value='';detailUpload(fs)}if(e.target.dataset&&e.target.dataset.field&&state.view==='task'){const f=e.target.dataset.field,t=tasks.find(x=>x.id===state.taskId);if(t){let v=e.target.value;if(f==='owner'&&v==='__other'){ownerInputMode(e.target,t);return}if(f==='title'){v=v.trim();if(!v){toast('Tên công việc không được để trống');e.target.value=t.title;return}}if(t[f]!==v)patchTask(t.id,{[f]:v},'Đã cập nhật',!!e.target.dataset.quiet)}}if(e.target.id==='outputFile'){const fs=[...e.target.files];e.target.value='';handleUpload(fs)}if(e.target.id==='importFile'){fileImport(e.target.files[0]);e.target.value=''}});document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.search=e.target.value;const start=e.target.selectionStart;const end=e.target.selectionEnd;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const inp=document.getElementById('globalSearch');inp.focus();inp.setSelectionRange(start,end)},180)}});document.addEventListener('submit',e=>{if(e.target.id==='passwordForm'){e.preventDefault();changePassword();return}if(e.target.id==='authForm'){e.preventDefault();authSubmit(e.target);return}if(e.target.id!=='taskForm')return;e.preventDefault();let f=new FormData(e.target),title=String(f.get('title')||'').trim();if(!title){toast('Vui lòng nhập tên công việc');return}let old=tasks.find(t=>t.id===state.modal),obj={title,category:f.get('category'),status:f.get('status'),priority:f.get('priority'),due:f.get('due')||'',owner:f.get('owner')==='__other'?String((document.getElementById('taskOwnerOther')||{}).value||'').trim().slice(0,80):String(f.get('owner')||'').trim(),description:rteValue('modalDesc'),output_text:rteValue('modalOut'),output_files:draftFiles.slice()};if(e.submitter&&e.submitter.dataset.deliver){if(!obj.output_text&&!obj.output_files.length){toast('Hãy nhập output hoặc đính kèm file trước khi trả task');return}obj.status='review'}if(obj.description.length>20000||obj.output_text.length>20000){toast('Mô tả hoặc output quá dài (tối đa ~20.000 ký tự)');return}e.target.querySelector('[type=submit]').disabled=true;state.modal=null;sync(async()=>{if(old){const rows=await api('tasks?id=eq.'+encodeURIComponent(old.id),{method:'PATCH',body:JSON.stringify(obj)});if(!rows.length)throw Error('task đã bị người khác xóa');return}for(let i=0;;i++){try{await api('tasks',{method:'POST',body:JSON.stringify({...obj,id:uniqueId(),created:localToday()})});return}catch(err){if(err.code!=='23505'||i>=4)throw err;tasks=await fetchTasks()}}},old?'Đã cập nhật công việc':'Đã tạo công việc mới')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.more-menu:not(.hide)')){closeMenus();return}if(e.key==='Escape'&&state.modal){closeModal();return}if((e.key==='n'||e.key==='N')&&!e.ctrlKey&&!e.metaKey&&!state.modal&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!document.activeElement?.closest?.('[contenteditable="true"]')){e.preventDefault();openNew('todo')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')&&!e.target.matches('button')){e.preventDefault();openTask(e.target.dataset.open)}});
let dragging=null;document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-drag]');if(!card)return;dragging=card.dataset.drag;card.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging)}});document.addEventListener('dragend',e=>{dragging=null;document.querySelectorAll('.dragover,.dragging').forEach(el=>el.classList.remove('dragover','dragging'))});document.addEventListener('dragover',e=>{let col=e.target.closest('[data-drop]');if(col){e.preventDefault();document.querySelectorAll('.dragover').forEach(el=>{if(el!==col)el.classList.remove('dragover')});col.classList.add('dragover')}});document.addEventListener('drop',e=>{let col=e.target.closest('[data-drop]');if(!col||!dragging)return;e.preventDefault();let task=tasks.find(t=>t.id===dragging);if(task&&task.status!==col.dataset.drop){const s=col.dataset.drop;task.status=s;render();sync(()=>api('tasks?id=eq.'+encodeURIComponent(task.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s})}),`Đã chuyển sang “${stat(s).label}”`)}dragging=null});
/* Tự đồng bộ thay đổi của thành viên khác: mỗi 20s và khi quay lại tab (bỏ qua khi đang nhập liệu/kéo thả) */
document.addEventListener('keydown',rteKey,true);document.addEventListener('paste',rtPaste,true);document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.rte button'))e.preventDefault()});document.addEventListener('input',e=>{const ed=e.target.closest&&e.target.closest('.rte-edit');if(ed)rteInput(e,ed)});document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.rte-bar button[data-rte]');if(b)showTip(b);else hideTip()});document.addEventListener('focusin',e=>{const b=e.target.closest&&e.target.closest('.rte-bar button[data-rte]');if(b)showTip(b);else hideTip()});document.addEventListener('mousedown',e=>{hideTip();if(!(e.target.closest&&e.target.closest('.rte-size,[data-rte=size]')))document.querySelectorAll('.rte-size').forEach(x=>x.classList.add('hide'))});window.addEventListener('scroll',hideTip,true);document.addEventListener('selectionchange',()=>{const n=rteSelNode(),el=n&&(n.nodeType===3?n.parentElement:n),ed=el&&el.closest&&el.closest('.rte-edit');if(ed)rteSync(ed)});document.addEventListener('focusin',e=>{if(e.target.closest&&e.target.closest('.rte-edit')){try{document.execCommand('defaultParagraphSeparator',false,'p');document.execCommand('styleWithCSS',false,false)}catch(x){}}});
function idle(){return !state.modal&&!dragging&&!state.editing&&!document.activeElement?.closest?.('[contenteditable="true"]')&&!document.getElementById('commentBody')?.textContent.trim()&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)}
async function poll(){if(!auth||document.hidden||!idle())return;const before=JSON.stringify(tasks);if(await refresh(true)&&JSON.stringify(tasks)!==before&&idle())render();if(state.view==='task')loadComments(state.taskId,true)}
setInterval(poll,20000);window.addEventListener('popstate',applyRoute);window.addEventListener('hashchange',applyRoute);window.addEventListener('focus',poll);
if(SUPABASE_URL.startsWith('PASTE')){document.getElementById('app').innerHTML='<div class="empty-state"><h3>Chưa cấu hình Supabase</h3><p>Mở index.html và điền SUPABASE_URL, SUPABASE_KEY.</p></div>'}else{document.getElementById('app').innerHTML='<div class="empty-state"><div class="empty-symbol">✳</div><h3>Đang tải dữ liệu...</h3></div>';(async()=>{const r=await authFromHash();if(r&&r.error){renderAuth('login',r.error);return}if(r&&r.setpw){renderAuth('setpw');return}if(!auth){renderAuth('login');return}await refresh(false);applyRoute()})()}
